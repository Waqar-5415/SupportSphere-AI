<!doctype html>
<html lang="en" data-theme="{{ current_user['theme'] if current_user else 'system' }}" data-textsize="{{ current_user['text_size'] if current_user else 'normal' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}AI customer support{% endblock %} · SupportSphere AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  {% block body %}{% endblock %}
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script>window.ICONS = {{ icons_json|tojson }};</script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
